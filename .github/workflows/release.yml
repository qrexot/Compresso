name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install test dependencies
        run: npm install --prefix tests --no-audit --no-fund
      - name: Run tests
        run: npm test --prefix tests
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build Compresso.exe
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-$env:GITHUB_RUN_NUMBER-$env:GITHUB_RUN_ATTEMPT"
          gh release create $tag ./release/Compresso.exe --target $env:GITHUB_SHA --title "Compresso $tag" --notes "Автоматическая сборка Compresso для Windows x64." --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
